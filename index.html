function speechRecognitionSupported(){
  return !!(window.SpeechRecognition || window.webkitSpeechRecognition);

/* Normaliza mayúsculas, acentos, apóstrofos y signos de puntuación */
function normalizeAnswer(value){
  let s = String(value == null ? '' : value).toLowerCase().trim();
  try { s = s.normalize('NFD').replace(/[\u0300-\u036f]/g, ''); } catch(e){}
  s = s.replace(/ß/g, 'ss').replace(/ё/g, 'е');
  s = s.replace(/['’‘`´]/g, '');
  s = s.replace(/[.,!?;:"“”«»¡¿…()\[\]{}\-–—_/\\|]/g, ' ');
  return s.replace(/\s+/g, ' ').trim();
}

function levenshtein(a, b){
  const m = a.length, n = b.length;
  if (!m) return n;
  if (!n) return m;
  let prev = new Array(n + 1), cur = new Array(n + 1);
  for (let j = 0; j <= n; j++) prev[j] = j;
  for (let i = 1; i <= m; i++){
    cur[0] = i;
    for (let j = 1; j <= n; j++){
      const cost = a.charAt(i - 1) === b.charAt(j - 1) ? 0 : 1;
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + cost);
    }
    const tmp = prev; prev = cur; cur = tmp;
  }
  return prev[n];
}

function similarityScore(a, b){
  const max = Math.max(a.length, b.length);
  if (!max) return 0;
  return 1 - levenshtein(a, b) / max;
}

function sameGlossTargets(lang, idx){
  const nPool = conceptPoolNative(curNative());
  const tPool = conceptPoolTarget(lang);
  const gloss = nPool[idx];
  if (!gloss) return [];
  const out = [];
  for (let j = 0; j < tPool.length; j++){
    if (nPool[j] === gloss) out.push(tPool[j]);
  }
  return out;
}

function acceptedAnswers(lang, idx, opts){
  opts = opts || {};
  const list = [conceptPoolTarget(lang)[idx]].filter(Boolean);
  if (!opts.strict){
    const variants = (ANSWER_VARIANTS[lang] || {})[idx] || [];
    variants.forEach(function(v){ list.push(v); });
  }
  if (opts.sameGloss) sameGlossTargets(lang, idx).forEach(function(v){ if (list.indexOf(v) === -1) list.push(v); });
  if (opts.roman){ const r = romanFor(lang, idx); if (r && list.indexOf(r) === -1) list.push(r); }
  if (opts.numbers && NUMBER_DIGITS[idx]) list.push(NUMBER_DIGITS[idx]);
  return list;
}

function answerMatches(value, accepted, mode){
  const input = normalizeAnswer(value);
  if (!input) return false;
  const cjk = curTarget() === 'zh' || curTarget() === 'ja';
  return accepted.some(function(ans){
    const target = normalizeAnswer(ans);
    if (!target) return false;
    if (input === target) return true;
    if (cjk && input.replace(/\s+/g, '') === target.replace(/\s+/g, '')) return true;
    if (mode === 'speaking'){
      const threshold = target.length <= 4 ? 0.8 : SPEAK_THRESHOLD;
      return similarityScore(input, target) >= threshold;
    }
    return false;
  });
}

function bestAnswerScore(value, accepted){
  if (!normalizeAnswer(value)) return 0;
  const cjk = curTarget() === 'zh' || curTarget() === 'ja';
  return accepted.reduce(function(best, ans){
    const target = normalizeAnswer(ans);
    if (!target) return best;
    let score = similarityScore(normalizeAnswer(value), target);
    if (normalizeAnswer(value) === target) score = 1;
    else if (cjk && normalizeAnswer(value).replace(/\s+/g, '') === target.replace(/\s+/g, '')) score = 1;
    return Math.max(best, score);
  }, 0);
}

const DEFAULT_STATE = {
  profile: null,          // { name, native:'es', target:'en', createdAt }
  xp: 0,
  streak: 0,
  lastActive: null,
  completed: {},          // { "en:A1-1:v": true, "en:A1-1:q": true, ... }
  settings: { rate: 0.9 }
};
let state = JSON.parse(JSON.stringify(DEFAULT_STATE));
let uiLang = 'es';
let screen = { name:'home' };
let player = null;
let setupDraft = { name:'', native:'es', target:'en' };

function save(){ try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch(e){} }
function load(){
  try { const raw = localStorage.getItem(STORE_KEY); if (raw) state = Object.assign(state, JSON.parse(raw)); } catch(e){}
  if (!state.completed || typeof state.completed !== 'object') state.completed = {};
  if (!state.settings || typeof state.settings !== 'object') state.settings = { rate:0.9 };
  if (migrateLegacyProgress()) save();
  if (state.profile && state.profile.native && UI[state.profile.native]){
    uiLang = state.profile.native;
    setupDraft.native = state.profile.native;
    setupDraft.target = state.profile.target || 'en';
    if (state.profile.name) setupDraft.name = state.profile.name;
  }
}

/* Migra el progreso del curso antiguo (target:nivel:tipo) al nuevo
   esquema por unidades (target:unidad:tipo). Se conserva el porcentaje:
   una lección antigua completada cuenta en las tres unidades del nivel. */
function migrateLegacyProgress(){
  let changed = false;
  const next = {};
  Object.keys(state.completed).forEach(function(key){
    const parts = key.split(':');
    if (parts.length === 3 && LEVELS.indexOf(parts[1]) !== -1 && LESSON_KINDS.indexOf(parts[2]) !== -1){
      const code = parts[0], level = parts[1], kind = parts[2];
      unitsForLevel(level).forEach(function(unit){ next[code + ':' + unit.id + ':' + kind] = true; });
      changed = true;
    } else {
      next[key] = true;
    }
  });
  if (changed) state.completed = next;
  return changed;
}

/* ============================================================
   4. UTILIDADES
   ============================================================ */
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function t(key){ const pack = UI[uiLang] || UI.es; return (pack[key] !== undefined ? pack[key] : UI.es[key]); }
function badgeText(id, field){ const pack = UI[uiLang] || UI.es; const b = pack.badges[id]; return b ? b[field] : UI.es.badges[id][field]; }
function targetLang(code){ return TARGET_LANGS.find(l => l.code === code) || TARGET_LANGS[0]; }
function targetName(code){ const l = targetLang(code); return l.name[uiLang] || l.name.en; }
function unitTitle(unit){ return unit.title[uiLang] || unit.title.en; }
function unitById(id){ return UNITS.find(function(u){ return u.id === id; }) || UNITS[0]; }
function unitsForLevel(level){ return UNITS.filter(function(u){ return u.level === level; }); }
function unitNumber(unit){ return unitsForLevel(unit.level).indexOf(unit) + 1; }
function levelName(level){ const m = LEVEL_META[level]; return m.name[uiLang] || m.name.en; }
function romanFor(code, idx){ return ROMAN[code] ? ROMAN[code][idx] : null; }
function curTarget(){ return (state.profile && state.profile.target) || 'en'; }
function curNative(){ return (state.profile && state.profile.native) || 'es'; }
function lessonMeta(kind){ return LESSON_META.find(function(m){ return m.kind === kind; }) || LESSON_META[0]; }
function lessonKindLabel(kind){ return t(lessonMeta(kind).label); }
function lessonKindIcon(kind){ return lessonMeta(kind).icon; }
function lessonLength(){
  if (!player) return 0;
  if (player.kind === 'v') return player.cards.length;
  if (player.kind === 'q') return player.questions.length;
  return player.items ? player.items.length : 0;
}

/* ============================================================
   5. TEXT-TO-SPEECH (Web Speech API)
   ============================================================ */
function speak(text, langCode){
  if (!('speechSynthesis' in window)) { toast(t('noTTS'), 'fa-triangle-exclamation'); return; }
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const lc = langCode || targetLang(curTarget()).tts;
    u.lang = lc;
    u.rate = state.settings.rate || 0.9;
    const voices = window.speechSynthesis.getVoices();
    const base = lc.split('-')[0].toLowerCase();
    const voice = voices.find(v => v.lang && v.lang.toLowerCase() === lc.toLowerCase())
               || voices.find(v => v.lang && v.lang.toLowerCase().indexOf(base) === 0);
    if (voice) u.voice = voice;
    window.speechSynthesis.speak(u);
  } catch(e){}
}
if ('speechSynthesis' in window) { window.speechSynthesis.onvoiceschanged = function(){}; }

/* ============================================================
   5b. RECONOCIMIENTO DE VOZ (Web Speech API)
   ============================================================ */
let activeRecognizer = null;

function stopActiveRecognition(){
  const rec = activeRecognizer;
  activeRecognizer = null;
  if (rec){
    try {
      rec.onresult = null; rec.onerror = null; rec.onend = null;
      rec.abort();
    } catch(e){}
  }
  if (player) player.listening = false;
}

function startListening(){
  if (!player || player.answered || player.done) return;
  if (player.listening){ stopActiveRecognition(); render(); return; }

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR){
    player.micFallback = true;
    player.micError = 'micUnsupported';
    render();
    return;
  }

  stopActiveRecognition();
  let rec;
  try { rec = new SR(); } catch(e){ player.micFallback = true; player.micError = 'micUnsupported'; render(); return; }

  activeRecognizer = rec;
  rec.lang = targetLang(curTarget()).tts;
  rec.interimResults = true;
  rec.continuous = false;
  rec.maxAlternatives = 5;

  rec.onstart = function(){
    if (activeRecognizer !== rec) return;
    player.listening = true;
    player.micError = null;
    render();
  };

  rec.onresult = function(e){
    if (activeRecognizer !== rec) return;
    const finals = [];
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++){
      const res = e.results[i];
      if (res.isFinal){
        for (let j = 0; j < res.length; j++){
          if (res[j] && res[j].transcript) finals.push(res[j].transcript);
        }
      } else if (res[0]){
        interim += res[0].transcript;
      }
    }
    const live = document.getElementById('liveTranscript');
    if (live) live.textContent = interim || finals[0] || '';
    if (finals.length){
      player.transcript = finals[0];
      player.listening = false;
      try { rec.stop(); } catch(err){}
      evaluateSpeaking(finals);
    } else if (interim){
      player.transcript = interim;
    }
  };

  rec.onerror = function(ev){
    if (activeRecognizer !== rec) return;
    activeRecognizer = null;
    player.listening = false;
    const code = ev && ev.error;
    player.micError = code === 'no-speech' ? 'micNoSpeech'
      : (code === 'not-allowed' || code === 'service-not-allowed') ? 'micDenied'
      : code === 'audio-capture' ? 'micNoDevice'
      : 'micError';
    render();
  };

  rec.onend = function(){
    if (activeRecognizer === rec) activeRecognizer = null;
    if (player && player.listening && !player.answered){
      player.listening = false;
      if (player.transcript) evaluateSpeaking([player.transcript]);
      else render();
    }
  };

  player.micError = null;
  player.micFallback = false;
  player.transcript = '';
  player.listening = true;
  render();

  try { rec.start(); }
  catch(err){
    activeRecognizer = null;
    player.listening = false;
    player.micError = 'micError';
    render();
  }
}

function stopListening(){
  const rec = activeRecognizer;
  if (rec){ try { rec.stop(); } catch(e){} }
  setTimeout(function(){
    if (activeRecognizer === rec && player && player.listening && !player.answered){
      player.listening = false;
      if (player.transcript) evaluateSpeaking([player.transcript]);
      else render();
    }
  }, 900);
}

function evaluateSpeaking(transcripts){
  if (!player || player.answered || player.done) return;
  const item = player.items[player.i];
  const list = (transcripts || []).filter(function(x){ return x && String(x).trim(); });
  if (!list.length){
    player.listening = false;
    player.micError = 'micNoSpeech';
    render();
    return;
  }
  let best = list[0], bestScore = -1;
  list.forEach(function(tr){
    const score = bestAnswerScore(tr, item.accepted);
    if (score > bestScore){ bestScore = score; best = tr; }
  });
  const targetNorm = normalizeAnswer(item.target);
  const threshold = targetNorm.length <= 4 ? 0.8 : SPEAK_THRESHOLD;
  const ok = bestScore >= threshold;
  player.listening = false;
  player.transcript = String(best).trim();
  player.userAnswer = player.transcript;
  player.answered = true;
  player.isCorrect = ok;
  if (ok) player.correct++;
  render();
}

/* ============================================================
   6. PROGRESO / GAMIFICACIÓN
   ============================================================ */
function lessonKey(unitId, kind){ return curTarget() + ':' + unitId + ':' + kind; }
function unitStats(unitId){
  let done = 0;
  LESSON_KINDS.forEach(function(k){ if (state.completed[lessonKey(unitId, k)]) done++; });
  const total = LESSON_KINDS.length;
  return { total:total, done:done, pct: total ? Math.round(done / total * 100) : 0 };
}
function levelStats(level){
  let done = 0, total = 0;
  unitsForLevel(level).forEach(function(unit){
    const s = unitStats(unit.id);
    done += s.done; total += s.total;
  });
  return { total:total, done:done, pct: total ? Math.round(done / total * 100) : 0 };
}
function overallStats(){
  let done = 0, total = 0;
  UNITS.forEach(function(unit){
    const s = unitStats(unit.id);
    done += s.done; total += s.total;
  });
  return { done:done, total:total, pct: total ? Math.round(done / total * 100) : 0 };
}
function isLevelUnlocked(level){
  const i = LEVELS.indexOf(level);
  if (i === 0) return true;
  return levelStats(LEVELS[i-1]).pct >= UNLOCK_PCT;
}
function isUnitUnlocked(unit){
  if (!isLevelUnlocked(unit.level)) return false;
  const siblings = unitsForLevel(unit.level);
  const i = siblings.indexOf(unit);
  if (i <= 0) return true;
  return unitStats(siblings[i-1].id).pct >= UNLOCK_PCT;
}
function findNextLesson(){
  for (const unit of UNITS){
    if (!isLevelUnlocked(unit.level) || !isUnitUnlocked(unit)) continue;
    for (const k of LESSON_KINDS){
      if (!state.completed[lessonKey(unit.id, k)]) return { unit:unit.id, level:unit.level, kind:k };
    }
  }
  return null;
}
function todayStr(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function dayDiff(a,b){ return Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00')) / 86400000); }
function touchStreak(){
  const today = todayStr();
  if (!state.lastActive) state.streak = 1;
  else {
    const diff = dayDiff(state.lastActive, today);
    if (diff === 1) state.streak += 1;
    else if (diff > 1) state.streak = 1;
  }
  state.lastActive = today;
}
function badgeDefs(){
  const o = overallStats();
  return [
    { id:'first', icon:'fa-shoe-prints', ok:o.done >= 1 },
    { id:'ten',   icon:'fa-book-bookmark', ok:o.done >= 10 },
    { id:'half',  icon:'fa-mountain-sun', ok:o.pct >= 50 },
    { id:'all',   icon:'fa-trophy', ok:o.done >= o.total },
    { id:'streak3', icon:'fa-fire-flame-curved', ok:state.streak >= 3 },
    { id:'streak7', icon:'fa-fire', ok:state.streak >= 7 },
    { id:'xp500', icon:'fa-bolt', ok:state.xp >= 500 }
  ];
}

/* ============================================================
   7. GENERADOR DE EJERCICIOS (a partir de los conceptos)
   ============================================================ */
function conceptPoolTarget(lang){ return LEX[lang] || LEX.en; }
function conceptPoolNative(nat){ return GLOSS[nat] || GLOSS.es; }
function pickOptions(correct, pool){
  const opts = [correct];
  const used = {}; used[correct] = true;
  const cand = pool.filter(x => !used[x]);
  for (let i = cand.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); const tmp = cand[i]; cand[i] = cand[j]; cand[j] = tmp; }
  for (let i = 0; i < cand.length && opts.length < 4; i++){ if (!used[cand[i]]){ opts.push(cand[i]); used[cand[i]] = true; } }
  for (let i = opts.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); const tmp = opts[i]; opts[i] = opts[j]; opts[j] = tmp; }
  return { options: opts, answer: opts.indexOf(correct) };
}
function buildQuestions(unitId){
  const unit = unitById(unitId);
  const lang = curTarget();
  const nat = curNative();
  const tPool = conceptPoolTarget(lang);
  const nPool = conceptPoolNative(nat);
  const qs = [];
  for (let i = unit.start; i < unit.end; i++){
    // Nativo -> Objetivo
    let r = pickOptions(tPool[i], tPool);
    qs.push({ kind:'n2t', sub:t('howSay'), prompt:nPool[i], options:r.options, answer:r.answer });
    // Objetivo -> Nativo
    r = pickOptions(nPool[i], nPool);
    qs.push({ kind:'t2n', sub:t('whatMeans'), prompt:tPool[i], audio:tPool[i], options:r.options, answer:r.answer });
  }
  // Escucha (para el primer concepto de la unidad)
  const first = unit.start;
  const rl = pickOptions(nPool[first], nPool);
  qs.push({ kind:'listen', sub:t('listenChoose'), prompt:'', audio:tPool[first], options:rl.options, answer:rl.answer });
  return qs;
}
function buildCards(unitId){
  const unit = unitById(unitId);
  const lang = curTarget();
  const nat = curNative();
  const cards = [];
  for (let i = unit.start; i < unit.end; i++){
    cards.push({ idx:i, word:LEX[lang][i], gloss:GLOSS[nat][i], roman:romanFor(lang, i) });
  }
  return cards;
}

/* Genera los ejercicios de expresión oral, escritura y dictado */
function buildItems(unitId, kind){
  const unit = unitById(unitId);
  const lang = curTarget();
  const nat = curNative();
  const tPool = conceptPoolTarget(lang);
  const nPool = conceptPoolNative(nat);
  const items = [];
  for (let i = unit.start; i < unit.end; i++){
    const roman = romanFor(lang, i);
    if (kind === 's'){
      items.push({
        idx:i, target:tPool[i], prompt:nPool[i], roman:roman,
        accepted: acceptedAnswers(lang, i, { roman:true, numbers:true })
      });
    } else if (kind === 'w'){
      items.push({
        idx:i, prompt:nPool[i], answer:tPool[i], roman:roman,
        accepted: acceptedAnswers(lang, i, { sameGloss:true, roman:true, numbers:true })
      });
    } else {
      items.push({
        idx:i, audio:tPool[i], answer:tPool[i], roman:roman,
        accepted: acceptedAnswers(lang, i, { roman:true, strict:true })
      });
    }
  }
  return items;
}

      +   '<i class="fa-solid ' + (done ? 'fa-circle-check text-emerald-400' : 'fa-chevron-right text-slate-500') + '"></i>'
      + '</button>';
    }).join('');

    return ''
    + '<div class="mt-4 overflow-hidden rounded-2xl border border-white/10 bg-slate-900/60">'
    +   '<div class="p-4">'
    +     '<div class="flex items-center gap-3">'
    +       '<span class="grid h-11 w-11 shrink-0 place-items-center rounded-xl bg-gradient-to-br ' + (unlocked ? meta.grad : 'from-slate-600 to-slate-700') + '"><i class="fa-solid ' + (unlocked ? unit.icon : 'fa-lock') + ' text-white"></i></span>'
    +       '<div class="min-w-0 flex-1"><p class="font-bold">' + esc(t('unit')) + ' ' + (index + 1) + ' · ' + esc(unitTitle(unit)) + '</p>'
    +         '<p class="text-xs text-slate-400">' + us.done + '/' + us.total + ' ' + esc(t('lessonWord')) + (unlocked ? '' : ' · ' + esc(t('locked'))) + '</p></div>'
    +       '<span class="text-sm font-extrabold ' + (unlocked ? meta.text : 'text-slate-500') + '">' + us.pct + '%</span>'
    +     '</div>'
    +     '<div class="mt-3">' + progressBar(us.pct, unlocked ? meta.grad : 'from-slate-600 to-slate-700') + '</div>'
    +   '</div>'
    +   (unlocked
        ? '<div class="space-y-1 border-t border-white/5 px-2 pb-2 pt-1">' + rows + '</div>'
        : '<div class="border-t border-white/5 px-4 py-4 text-sm text-slate-400"><i class="fa-solid fa-lock mr-2 text-slate-500"></i>' + esc(t('unitLocked')) + '</div>')
    + '</div>';
  }).join('');

  return ''
  + '<section class="animate-fadeUp">'
  +   '<button data-action="nav-home" class="mb-4 inline-flex items-center gap-2 text-sm text-slate-400 transition hover:text-slate-200"><i class="fa-solid fa-arrow-left"></i> ' + esc(t('back')) + '</button>'
  +   '<div class="flex items-center gap-4 rounded-3xl border border-white/10 bg-slate-900/60 p-5">'
  +     '<span class="grid h-14 w-14 place-items-center rounded-2xl bg-gradient-to-br ' + meta.grad + '"><i class="fa-solid ' + meta.icon + ' text-2xl text-white"></i></span>'
  +     '<div class="flex-1"><div class="flex items-center gap-2"><h2 class="text-xl font-extrabold">' + lv + ' · ' + esc(levelName(lv)) + '</h2>'
  +       '<span class="rounded-full bg-white/10 px-2 py-0.5 text-[10px] font-bold uppercase tracking-wide text-slate-300">' + esc(t('proficiency')) + '</span></div>'
  +       '<p class="text-sm text-slate-400">' + s.done + '/' + s.total + ' ' + esc(t('lessonWord')) + '</p></div>'
  +     '<span class="text-2xl font-extrabold ' + meta.text + '">' + s.pct + '%</span>'
  +   '</div>'
  +   '<div class="mt-3">' + progressBar(s.pct, meta.grad) + '</div>'
  +   unitCards
  + '</section>';
}

function currentLessonMeta(){ return { level:player.level, kind:player.kind }; }

function lessonScreen(){
  if (player.done) return resultView();
  if (player.kind === 'v') return vocabView();
  if (player.kind === 'q') return quizView();
  if (player.kind === 's') return speakingView();
  return typingView();
}

function lessonHeader(pct){
  return ''
  + '<div class="mb-5 flex items-center gap-3">'
  +   '<button data-action="exit-lesson" class="grid h-9 w-9 place-items-center rounded-full border border-white/10 bg-slate-900/60 text-slate-300 transition hover:text-white"><i class="fa-solid fa-xmark"></i></button>'
  +   '<div class="flex-1">' + progressBar(pct) + '</div>'
  +   '<span class="text-xs font-semibold text-slate-400">' + player.level + ' · U' + unitNumber(unitById(player.unit)) + '</span>'
  + '</div>';
}

function vocabView(){
  const card = player.cards[player.i];
  const total = player.cards.length;
  const pct = Math.round(player.i / total * 100);
  const unit = unitById(player.unit);
  const isCJK = !!targetLang(curTarget()).roman;
  return ''
  + '<section class="animate-fadeUp">'
  +   lessonHeader(pct)
  +   '<p class="mb-1 text-center text-xs font-semibold uppercase tracking-wider text-slate-400">' + esc(t('card')) + ' ' + (player.i+1) + ' ' + esc(t('of')) + ' ' + total + '</p>'
  +   '<h2 class="mb-5 text-center text-lg font-bold">' + esc(unitTitle(unit)) + ' · ' + esc(t('vocab')) + '</h2>'
  +   '<div class="animate-pop rounded-3xl border border-white/10 bg-gradient-to-br from-slate-900 to-slate-950 p-8 text-center shadow-2xl">'
  +     '<p class="' + (isCJK ? 'cjk ' : '') + 'text-3xl font-extrabold tracking-tight sm:text-4xl">' + esc(card.word) + '</p>'
  +     (card.roman ? '<p class="mt-1 text-sm text-slate-400">[' + esc(card.roman) + ']</p>' : '')
  +     '<div class="mt-4 flex items-center justify-center">'
  +       '<button data-action="speak" data-text="' + esc(card.word) + '" class="grid h-14 w-14 place-items-center rounded-full border border-brand-500/40 bg-brand-500/10 text-brand-300 transition hover:bg-brand-500/20 pulse-ring">'
  +         '<i class="fa-solid fa-volume-high text-xl"></i></button>'
  +     '</div>'
  +     '<p class="mt-2 text-xs text-slate-500">' + esc(t('listen')) + '</p>'
  +     (player.revealed
        ? '<p class="mt-5 border-t border-white/10 pt-5 text-2xl font-bold text-brand-300 animate-fadeUp">' + esc(card.gloss) + '</p>'
        : '<button data-action="reveal" class="mt-5 w-full rounded-xl border border-dashed border-white/15 px-4 py-3 text-sm font-medium text-slate-400 transition hover:border-white/30 hover:text-slate-200">' + esc(t('showTranslation')) + '</button>')
  +   '</div>'
  +   '<button data-action="next" class="mt-6 w-full rounded-xl bg-gradient-to-r from-brand-500 to-cyan-500 px-4 py-3.5 font-semibold text-white shadow-lg shadow-brand-900/40 transition hover:brightness-110 active:scale-[.99]">'
  +     (player.i === total-1 ? esc(t('finishLesson')) : esc(t('next'))) + ' <i class="fa-solid fa-arrow-right ml-1"></i></button>'
  + '</section>';
}

function quizView(){
  const qn = player.questions[player.i];
  const total = player.questions.length;
  const pct = Math.round(player.i / total * 100);
  const isCJK = !!targetLang(curTarget()).roman;

  const options = qn.options.map(function(opt, idx){
    let cls = 'border-white/10 bg-slate-900/60 hover:border-white/25 hover:bg-slate-900';
    let icon = '';
    if (player.answered){
      if (idx === qn.answer){ cls = 'border-emerald-500/50 bg-emerald-500/15 text-emerald-200'; icon = '<i class="fa-solid fa-circle-check text-emerald-400"></i>'; }
      else if (idx === player.chosen){ cls = 'border-rose-500/50 bg-rose-500/15 text-rose-200'; icon = '<i class="fa-solid fa-circle-xmark text-rose-400"></i>'; }
      else { cls = 'border-white/10 bg-slate-900/40 opacity-60'; }
    }
    return ''
    + '<button data-action="answer" data-index="' + idx + '" ' + (player.answered ? 'disabled' : '') + ' '
    +   'class="flex w-full items-center justify-between gap-3 rounded-xl border px-4 py-3.5 text-left font-medium transition ' + cls + '">'
    +   '<span class="' + (isCJK ? 'cjk ' : '') + '">' + esc(opt) + '</span>' + icon + '</button>';
  }).join('');

  let promptBlock = '';
  if (qn.kind === 'listen'){
    promptBlock = ''
    + '<div class="text-center">'
    +   '<button data-action="speak" data-text="' + esc(qn.audio) + '" class="mx-auto grid h-20 w-20 place-items-center rounded-full border border-brand-500/40 bg-brand-500/10 text-brand-300 transition hover:bg-brand-500/20 pulse-ring">'
    +     '<i class="fa-solid fa-volume-high text-3xl"></i></button>'
    +   '<p class="mt-3 text-sm text-slate-400">' + esc(t('listen')) + '</p>'
    + '</div>';
  } else if (qn.kind === 't2n'){
    promptBlock = ''
    + '<div class="text-center">'
    +   '<p class="text-xs font-semibold uppercase tracking-wider text-slate-400">' + esc(qn.sub) + '</p>'
    +   '<p class="mt-2 ' + (isCJK ? 'cjk ' : '') + 'text-3xl font-extrabold">' + esc(qn.prompt) + '</p>'
    +   '<button data-action="speak" data-text="' + esc(qn.audio) + '" class="mt-3 inline-flex items-center gap-2 rounded-full border border-brand-500/40 bg-brand-500/10 px-4 py-2 text-sm font-semibold text-brand-300 transition hover:bg-brand-500/20"><i class="fa-solid fa-volume-high"></i> ' + esc(t('listen')) + '</button>'
    + '</div>';
  } else {
    promptBlock = ''
    + '<div class="text-center">'
    +   '<p class="text-xs font-semibold uppercase tracking-wider text-slate-400">' + esc(qn.sub) + '</p>'
    +   '<p class="mt-2 text-2xl font-extrabold leading-snug">' + esc(qn.prompt) + '</p>'
    + '</div>';
  }

  return ''
  + '<section class="animate-fadeUp">'
  +   lessonHeader(pct)
  +   '<p class="mb-1 text-center text-xs font-semibold uppercase tracking-wider text-slate-400">' + esc(t('question')) + ' ' + (player.i+1) + ' ' + esc(t('of')) + ' ' + total + '</p>'
  +   '<div class="mb-5 flex items-center justify-center gap-2"><i class="fa-solid fa-bolt text-brand-400"></i><span class="text-sm font-semibold text-slate-300">' + player.correct + ' ' + esc(t('hits')) + '</span></div>'
  +   '<div class="rounded-3xl border border-white/10 bg-slate-900/60 p-6 shadow-2xl">'
  +     promptBlock
  +     '<div class="mt-6 space-y-2.5">' + options + '</div>'
  +   '</div>'
  +   (player.answered
      ? '<button data-action="next" class="mt-6 w-full rounded-xl bg-gradient-to-r from-brand-500 to-cyan-500 px-4 py-3.5 font-semibold text-white shadow-lg shadow-brand-900/40 transition hover:brightness-110 active:scale-[.99]">'
        + (player.i === total-1 ? esc(t('seeResult')) : esc(t('nextQuestion'))) + ' <i class="fa-solid fa-arrow-right ml-1"></i></button>'
      : '<p class="mt-4 text-center text-sm text-slate-500">' + esc(t('selectAnswer')) + '</p>')
  + '</section>';
}

function nextButtonLabel(){
  return player.i === lessonLength() - 1 ? t('seeResult') : t('nextQuestion');
}

function feedbackBox(ok, opts){
  opts = opts || {};
  const tone = ok
    ? 'border-emerald-500/40 bg-emerald-500/10'
    : 'border-rose-500/40 bg-rose-500/10';
  const icon = ok ? 'fa-circle-check text-emerald-400' : 'fa-circle-xmark text-rose-400';
  const title = ok ? 'text-emerald-200' : 'text-rose-200';
  let lines = '';
  if (opts.heard) lines += '<p class="mt-1 text-sm text-slate-300">' + esc(t('heard')) + ': <span class="font-semibold">' + esc(opts.heard) + '</span></p>';
  if (opts.your) lines += '<p class="mt-1 text-sm text-slate-300">' + esc(t('yourAnswer')) + ': <span class="font-semibold">' + esc(opts.your) + '</span></p>';
  if (!ok && opts.expected) lines += '<p class="mt-1 text-sm text-slate-300">' + esc(t('expected')) + ': <span class="font-semibold text-white">' + esc(opts.expected) + '</span></p>';
  if (!ok && opts.roman) lines += '<p class="mt-0.5 text-xs text-slate-400">[' + esc(opts.roman) + ']</p>';
  return ''
  + '<div class="mt-5 rounded-2xl border p-4 text-left animate-pop ' + tone + '" role="status" aria-live="polite">'
  +   '<div class="flex items-start gap-3">'
  +     '<i class="fa-solid ' + icon + ' mt-0.5 text-xl"></i>'
  +     '<div class="min-w-0 flex-1"><p class="font-bold ' + title + '">' + esc(ok ? t('correct') : t('incorrect')) + '</p>' + lines + '</div>'
  +   '</div>'
  + '</div>';
}

function speakingView(){
  const item = player.items[player.i];
  const total = player.items.length;
  const pct = Math.round(player.i / total * 100);
  const isCJK = !!targetLang(curTarget()).roman;
  const supported = speechRecognitionSupported();
  const showInput = !supported || player.micFallback;

  let micBlock = '';
  if (player.listening){
    let bars = '';
    for (let b = 0; b < 5; b++) bars += '<span class="wave-bar"></span>';
    micBlock = ''
    + '<div class="text-center">'
    +   '<button data-action="stop-listening" class="mic-live mx-auto grid h-24 w-24 place-items-center rounded-full border border-rose-400/50 bg-rose-500/15 text-rose-300 transition hover:bg-rose-500/25" aria-label="' + esc(t('stopRecording')) + '">'
    +     '<i class="fa-solid fa-stop text-2xl"></i></button>'
    +   '<div class="mt-4 flex h-6 items-center justify-center gap-1 text-rose-300">' + bars + '</div>'
    +   '<p class="mt-2 text-sm font-semibold text-rose-300">' + esc(t('recording')) + '</p>'
    +   '<p id="liveTranscript" class="mt-2 min-h-[1.5rem] px-2 text-sm text-slate-300">' + esc(player.transcript || '') + '</p>'
    +   '<p class="mt-1 text-xs text-slate-500">' + esc(t('stopRecording')) + '</p>'
    + '</div>';
  } else if (!player.answered){
    micBlock = ''
    + '<div class="text-center">'
    +   '<button data-action="start-listening" ' + (supported ? '' : 'disabled') + ' class="mx-auto grid h-24 w-24 place-items-center rounded-full border transition '
    +     (supported ? 'border-brand-500/40 bg-brand-500/10 text-brand-300 pulse-ring hover:bg-brand-500/20' : 'border-white/10 bg-white/5 text-slate-600') + '" aria-label="' + esc(t('pressToSpeak')) + '">'
    +     '<i class="fa-solid fa-microphone text-3xl"></i></button>'
    +   '<p class="mt-3 px-2 text-sm ' + (supported ? 'text-slate-400' : 'text-amber-200') + '">' + esc(supported ? t('speakHint') : t('micUnsupported')) + '</p>'
    +   (supported && !showInput ? '<button data-action="use-typing" class="mt-2 text-xs font-semibold text-brand-300 transition hover:text-brand-200"><i class="fa-solid fa-keyboard mr-1"></i>' + esc(t('typeInstead')) + '</button>' : '')
    +   (player.micError ? '<p class="mt-3 rounded-xl border border-amber-500/30 bg-amber-500/10 px-3 py-2 text-xs text-amber-200">' + esc(t(player.micError)) + '</p>' : '')
    + '</div>';
  }

  const inputBlock = (showInput && !player.answered)
    ? '<div class="mt-5">'
      + '<input id="answerInput" data-input="answer" type="text" value="' + esc(player.inputDraft || '') + '" autocomplete="off" autocapitalize="none" spellcheck="false" '
      +   'placeholder="' + esc(t('typeInstead')) + '" class="' + (isCJK ? 'cjk ' : '') + 'w-full rounded-xl border border-white/10 bg-slate-950/60 px-4 py-3 text-center text-lg font-semibold text-slate-100 outline-none transition focus:border-brand-500 focus:ring-2 focus:ring-brand-500/30">'
      + '<button data-action="check-answer" class="mt-3 w-full rounded-xl bg-gradient-to-r from-brand-500 to-cyan-500 px-4 py-3 font-semibold text-white shadow-lg shadow-brand-900/40 transition hover:brightness-110 active:scale-[.99]">'
      +   esc(t('checkAnswer')) + ' <i class="fa-solid fa-circle-check ml-1"></i></button>'
      + '</div>'
    : '';

  const feedback = player.answered
    ? feedbackBox(player.isCorrect, (showInput || !supported)
        ? { your: player.userAnswer, expected: item.target, roman: item.roman }
        : { heard: player.transcript, expected: item.target, roman: item.roman })
    : '';
  const retryBtn = (player.answered && !player.isCorrect)
    ? '<button data-action="retry-speaking" class="mt-3 inline-flex items-center gap-2 rounded-xl border border-white/10 bg-slate-900/60 px-4 py-2 text-sm font-semibold text-slate-200 transition hover:bg-slate-900"><i class="fa-solid fa-rotate-right"></i> ' + esc(t('tryAgain')) + '</button>'
    : '';

  return ''
  + '<section class="animate-fadeUp">'
  +   lessonHeader(pct)
  +   '<p class="mb-1 text-center text-xs font-semibold uppercase tracking-wider text-slate-400">' + esc(t('speaking')) + ' · ' + (player.i + 1) + ' ' + esc(t('of')) + ' ' + total + '</p>'
  +   '<div class="mb-5 flex items-center justify-center gap-2"><i class="fa-solid fa-microphone text-brand-400"></i><span class="text-sm font-semibold text-slate-300">' + player.correct + ' ' + esc(t('hits')) + '</span></div>'
  +   '<div class="rounded-3xl border border-white/10 bg-slate-900/60 p-6 shadow-2xl">'
  +     '<div class="text-center">'
  +       '<p class="text-xs font-semibold uppercase tracking-wider text-slate-400">' + esc(t('speakPrompt')) + '</p>'
  +       '<p class="mt-2 ' + (isCJK ? 'cjk ' : '') + 'text-3xl font-extrabold leading-snug sm:text-4xl">' + esc(item.target) + '</p>'
  +       (item.roman ? '<p class="mt-1 text-sm text-slate-400">[' + esc(item.roman) + ']</p>' : '')
  +       '<p class="mt-3 text-sm text-slate-500">' + esc(item.prompt) + '</p>'
  +       '<button data-action="speak" data-text="' + esc(item.target) + '" class="mt-3 inline-flex items-center gap-2 rounded-full border border-brand-500/40 bg-brand-500/10 px-4 py-2 text-sm font-semibold text-brand-300 transition hover:bg-brand-500/20"><i class="fa-solid fa-volume-high"></i> ' + esc(t('listen')) + '</button>'
  +     '</div>'
  +     '<div class="mt-6 border-t border-white/10 pt-6">' + micBlock + inputBlock + feedback + retryBtn + '</div>'
  +   '</div>'
  +   (player.answered
      ? '<button data-action="next" class="mt-6 w-full rounded-xl bg-gradient-to-r from-brand-500 to-cyan-500 px-4 py-3.5 font-semibold text-white shadow-lg shadow-brand-900/40 transition hover:brightness-110 active:scale-[.99]">'
        + esc(nextButtonLabel()) + ' <i class="fa-solid fa-arrow-right ml-1"></i></button>'
      : '')
  + '</section>';
}

function typingView(){
  const isDict = player.kind === 'd';
  const item = player.items[player.i];
  const total = player.items.length;
  const pct = Math.round(player.i / total * 100);
  const isCJK = !!targetLang(curTarget()).roman;
  const showHint = !!player.hintOpen && !!item.roman;

  let promptBlock = '';
  if (isDict){
    promptBlock = ''
    + '<div class="text-center">'
    +   '<p class="text-xs font-semibold uppercase tracking-wider text-slate-400">' + esc(t('dictationPrompt')) + '</p>'
    +   '<button data-action="speak" data-text="' + esc(item.audio) + '" class="mx-auto mt-4 grid h-20 w-20 place-items-center rounded-full border border-brand-500/40 bg-brand-500/10 text-brand-300 transition hover:bg-brand-500/20 pulse-ring" aria-label="' + esc(t('playAudio')) + '">'
    +     '<i class="fa-solid fa-volume-high text-3xl"></i></button>'
    +   '<button data-action="speak" data-text="' + esc(item.audio) + '" class="mt-3 inline-flex items-center gap-2 text-sm font-semibold text-slate-300 transition hover:text-white"><i class="fa-solid fa-rotate-right"></i> ' + esc(t('replayAudio')) + '</button>'
    + '</div>';
  } else {
    promptBlock = ''
    + '<div class="text-center">'
    +   '<p class="text-xs font-semibold uppercase tracking-wider text-slate-400">' + esc(t('howSay')) + '</p>'
    +   '<p class="mt-2 text-2xl font-extrabold leading-snug">' + esc(item.prompt) + '</p>'
    +   '<p class="mt-1 text-xs text-slate-500">' + esc(t('typeTranslation')) + '</p>'
    + '</div>';
  }

  const inputBorder = player.answered
    ? (player.isCorrect ? 'border-emerald-500/50 focus:border-emerald-500' : 'border-rose-500/50 focus:border-rose-500')
    : 'border-white/10 focus:border-brand-500';
  const inputBlock = ''
  + '<input id="answerInput" data-input="answer" type="text" value="' + esc(player.inputDraft || '') + '" ' + (player.answered ? 'disabled ' : '') + 'autocomplete="off" autocapitalize="none" spellcheck="false" '
  +   'placeholder="' + esc(isDict ? t('dictationPrompt') : t('typeTranslation')) + '" class="mt-5 w-full rounded-xl border bg-slate-950/60 px-4 py-3.5 text-center text-lg font-semibold text-slate-100 outline-none transition focus:ring-2 focus:ring-brand-500/30 ' + (isCJK ? 'cjk ' : '') + inputBorder + '">';

  let hintBlock = '';
  if (item.roman){
    hintBlock = ''
    + '<div class="mt-3 text-center">'
    +   '<button data-action="toggle-hint" class="inline-flex items-center gap-1.5 text-xs font-semibold text-slate-400 transition hover:text-brand-300"><i class="fa-solid fa-lightbulb"></i> ' + esc(showHint ? t('hideHint') : t('showHint')) + '</button>'
    +   (showHint
        ? '<div class="mt-2 rounded-xl border border-white/10 bg-white/5 px-3 py-2 text-sm text-slate-300"><span class="text-xs uppercase tracking-wide text-slate-500">' + esc(t('pronHint')) + '</span><br>[' + esc(item.roman) + ']</div>'
        : '')
    + '</div>';
  }

  const feedback = player.answered
    ? feedbackBox(player.isCorrect, { your: player.userAnswer, expected: item.answer, roman: item.roman })
    : '';

  return ''
  + '<section class="animate-fadeUp">'
  +   lessonHeader(pct)
  +   '<p class="mb-1 text-center text-xs font-semibold uppercase tracking-wider text-slate-400">' + esc(isDict ? t('dictation') : t('writing')) + ' · ' + (player.i + 1) + ' ' + esc(t('of')) + ' ' + total + '</p>'
  +   '<div class="mb-5 flex items-center justify-center gap-2"><i class="fa-solid ' + (isDict ? 'fa-headphones' : 'fa-pen-nib') + ' text-brand-400"></i><span class="text-sm font-semibold text-slate-300">' + player.correct + ' ' + esc(t('hits')) + '</span></div>'
  +   '<div class="rounded-3xl border border-white/10 bg-slate-900/60 p-6 shadow-2xl">'
  +     promptBlock
  +     (isCJK ? '<p class="mt-2 text-center text-xs text-slate-500">' + esc(t('romanAcceptedNote')) + '</p>' : '')
  +     inputBlock
  +     hintBlock
  +     feedback
  +   '</div>'
  +   (player.answered
      ? '<button data-action="next" class="mt-6 w-full rounded-xl bg-gradient-to-r from-brand-500 to-cyan-500 px-4 py-3.5 font-semibold text-white shadow-lg shadow-brand-900/40 transition hover:brightness-110 active:scale-[.99]">'
        + esc(nextButtonLabel()) + ' <i class="fa-solid fa-arrow-right ml-1"></i></button>'
      : '<button data-action="check-answer" class="mt-6 w-full rounded-xl bg-gradient-to-r from-brand-500 to-cyan-500 px-4 py-3.5 font-semibold text-white shadow-lg shadow-brand-900/40 transition hover:brightness-110 active:scale-[.99]">'
        + esc(t('checkAnswer')) + ' <i class="fa-solid fa-circle-check ml-1"></i></button>'
        + '<p class="mt-3 text-center text-xs text-slate-500">' + esc(t('enterToCheck')) + '</p>')
  + '</section>';
}

function checkTypedAnswer(){
  if (!player || player.answered || player.done) return;
  if (player.kind !== 'w' && player.kind !== 'd' && player.kind !== 's') return;
  const input = document.getElementById('answerInput');
  const value = String(input ? input.value : (player.inputDraft || '')).trim();
  if (!value){ toast(t('answerRequired'), 'fa-keyboard'); return; }
  const item = player.items[player.i];
  const mode = player.kind === 'd' ? 'dictation' : 'writing';
  const ok = answerMatches(value, item.accepted, mode);
  player.inputDraft = value;
  player.userAnswer = value;
  player.answered = true;
  player.isCorrect = ok;
  if (ok) player.correct++;
  render();
}

function resultView(){
  const isQuiz = player.kind !== 'v';
  const total = lessonLength();
  const perfect = isQuiz && player.correct === total;
  const unit = unitById(player.unit);
  return ''
  + '<section class="animate-pop text-center">'
  +   '<div class="mx-auto mt-6 grid h-24 w-24 place-items-center rounded-full bg-gradient-to-br from-brand-500 to-cyan-500 shadow-2xl shadow-brand-900/50">'
  +     '<i class="fa-solid fa-' + (perfect ? 'star' : 'flag-checkered') + ' text-4xl text-white"></i></div>'
  +   '<h2 class="mt-5 text-2xl font-extrabold">' + esc(t('completeTitle')) + '</h2>'
  +   '<p class="text-slate-400">' + esc(t('unit')) + ' ' + unitNumber(unit) + ' · ' + esc(unitTitle(unit)) + ' · ' + esc(lessonKindLabel(player.kind)) + '</p>'
  +   (isQuiz ? '<p class="mt-1 text-sm text-slate-400">' + esc(t('hits')) + ': <span class="font-bold text-slate-200">' + player.correct + '/' + total + '</span></p>' : '')
  +   '<div class="mx-auto mt-6 flex max-w-xs items-center justify-center gap-3 rounded-2xl border border-brand-500/30 bg-brand-500/10 px-6 py-4">'
  +     '<i class="fa-solid fa-bolt text-2xl text-brand-400"></i>'
  +     '<div class="text-left"><p class="text-2xl font-extrabold">+' + player.xpEarned + '</p><p class="text-xs text-slate-400">' + esc(t('xpPoints')) + '</p></div>'
  +   '</div>'
  +   '<div class="mt-8 space-y-3">'
  +     '<button data-action="back-path" class="w-full rounded-xl bg-gradient-to-r from-brand-500 to-cyan-500 px-4 py-3.5 font-semibold text-white shadow-lg shadow-brand-900/40 transition hover:brightness-110 active:scale-[.99]">' + esc(t('continueBtn')) + '</button>'
  +     '<button data-action="retry" class="w-full rounded-xl border border-white/10 bg-slate-900/60 px-4 py-3 font-semibold text-slate-200 transition hover:bg-slate-900">' + esc(t('repeatLesson')) + '</button>'
  +   '</div>'
  + '</section>';
}

function profileScreen(){
  const o = overallStats();
  const meta = state.profile || {};
  const nativeOpts = NATIVE_LANGS.map(l => '<option value="' + l.code + '"' + (l.code === curNative() ? ' selected' : '') + '>' + l.label + '</option>').join('');
  const targetOpts = TARGET_LANGS.map(l => '<option value="' + l.code + '"' + (l.code === curTarget() ? ' selected' : '') + '>' + l.flag + ' ' + esc(l.name[uiLang] || l.name.en) + '</option>').join('');
  const badgeEl = function(b){
    return ''
    + '<div class="flex flex-col items-center gap-1.5 rounded-2xl border p-3 text-center ' + (b.ok ? 'border-brand-500/30 bg-brand-500/10' : 'border-white/10 bg-slate-900/40 opacity-50') + '">'
    +   '<i class="fa-solid ' + b.icon + ' text-xl ' + (b.ok ? 'text-brand-300' : 'text-slate-500') + '"></i>'
    +   '<span class="text-xs font-semibold">' + esc(badgeText(b.id,'n')) + '</span>'
    +   '<span class="text-[10px] leading-tight text-slate-400">' + esc(badgeText(b.id,'d')) + '</span></div>';
  };
  return ''
  + '<section class="animate-fadeUp">'
  +   '<div class="flex items-center gap-4 rounded-3xl border border-white/10 bg-slate-900/60 p-5">'
  +     '<span class="grid h-16 w-16 place-items-center rounded-2xl bg-gradient-to-br from-brand-500 to-cyan-500 text-2xl font-extrabold text-white">' + esc((meta.name || 'E').charAt(0).toUpperCase()) + '</span>'
  +     '<div><p class="text-xl font-extrabold">' + esc(meta.name || 'Estudiante') + '</p>'
  +       '<p class="text-sm text-slate-400">' + esc((NATIVE_LANGS.find(l=>l.code===curNative())||{label:'Español'}).label) + ' → ' + targetLang(curTarget()).flag + ' ' + esc(targetName(curTarget())) + '</p></div>'
  +   '</div>'
  +   '<div class="mt-4 grid grid-cols-2 gap-3">'
  +     '<div class="rounded-2xl border border-white/10 bg-slate-900/60 p-4"><p class="text-xs text-slate-400">' + esc(t('xp')) + '</p><p class="text-2xl font-extrabold text-brand-300">' + state.xp + ' XP</p></div>'
  +     '<div class="rounded-2xl border border-white/10 bg-slate-900/60 p-4"><p class="text-xs text-slate-400">' + esc(t('streak')) + '</p><p class="text-2xl font-extrabold text-amber-400">' + state.streak + ' <span class="text-sm">' + esc(t('days')) + '</span></p></div>'
  +   '</div>'
  +   '<h3 class="mb-3 mt-8 text-sm font-semibold uppercase tracking-wider text-slate-400">' + esc(t('changeLangs')) + '</h3>'
  +   '<div class="grid grid-cols-1 gap-4 sm:grid-cols-2">'
  +     '<div><label class="mb-1 block text-xs font-medium text-slate-400">' + esc(t('nativeLabel')) + '</label>'
  +       '<select data-change="native" class="w-full rounded-xl border border-white/10 bg-slate-950/60 px-3 py-2.5 text-sm text-slate-100 outline-none focus:border-brand-500">' + nativeOpts + '</select></div>'
  +     '<div><label class="mb-1 block text-xs font-medium text-slate-400">' + esc(t('targetLabel')) + '</label>'
  +       '<select data-change="target" class="w-full rounded-xl border border-white/10 bg-slate-950/60 px-3 py-2.5 text-sm text-slate-100 outline-none focus:border-brand-500">' + targetOpts + '</select></div>'
  +   '</div>'
  +   '<h3 class="mb-3 mt-8 text-sm font-semibold uppercase tracking-wider text-slate-400">' + esc(t('achievements')) + '</h3>'
  +   '<div class="grid grid-cols-3 gap-3 sm:grid-cols-4">' + badgeDefs().map(badgeEl).join('') + '</div>'
  +   '<h3 class="mb-3 mt-8 text-sm font-semibold uppercase tracking-wider text-slate-400">' + esc(t('settings')) + '</h3>'
  +   '<div class="space-y-2">'
  +     '<div class="flex items-center justify-between rounded-xl border border-white/10 bg-slate-900/50 px-4 py-3"><span class="text-sm text-slate-400">' + esc(t('completedLessons')) + '</span><span class="text-sm font-semibold">' + o.done + ' / ' + o.total + '</span></div>'
  +     '<div class="flex items-center justify-between rounded-xl border border-white/10 bg-slate-900/50 px-4 py-3"><span class="text-sm text-slate-400">' + esc(t('totalProgress')) + '</span><span class="text-sm font-semibold">' + o.pct + '%</span></div>'
  +     '<div class="flex items-center justify-between rounded-xl border border-white/10 bg-slate-900/50 px-4 py-3"><span class="text-sm text-slate-400">' + esc(t('voiceSpeed')) + '</span>'
  +       '<button data-action="toggle-speed" class="rounded-lg border border-white/10 bg-slate-950/60 px-3 py-1.5 text-sm font-semibold">' + (state.settings.rate >= 1 ? esc(t('speedNormal')) : esc(t('speedSlow'))) + '</button></div>'
  +   '</div>'
  +   '<button data-action="reset" class="mt-6 w-full rounded-xl border border-rose-500/30 bg-rose-500/10 px-4 py-3 font-semibold text-rose-300 transition hover:bg-rose-500/20"><i class="fa-solid fa-trash-can mr-1"></i> ' + esc(t('resetProgress')) + '</button>'
  +   '<p class="mt-4 text-center text-xs text-slate-500">DuckQuest · localStorage</p>'
  + '</section>';
}

/* ============================================================
   10. RENDER
   ============================================================ */
function render(){
  const app = document.getElementById('app');
  if (!state.profile){ stopActiveRecognition(); app.innerHTML = setupScreen(); return; }
  const isLesson = screen.name === 'lesson';
  const isSpeaking = isLesson && player && player.kind === 's';
  if (!isSpeaking) stopActiveRecognition();
  if (!isLesson){ try { window.speechSynthesis.cancel(); } catch(e){} }

  let content;
  if (screen.name === 'path') content = pathScreen();
  else if (screen.name === 'profile') content = profileScreen();
  else if (screen.name === 'lesson') content = lessonScreen();
  else content = homeScreen();
  app.innerHTML = header() + '<main class="mx-auto max-w-4xl px-4 pt-6 ' + (isLesson ? 'pb-10' : 'pb-28') + '">' + content + '</main>' + (isLesson ? '' : bottomNav());

  if (isLesson && player && !player.done && player.kind === 'd' && !player.answered && !player.autoPlayed){
    player.autoPlayed = true;
    const text = player.items[player.i].audio;
    setTimeout(function(){
      if (screen.name === 'lesson' && player && player.kind === 'd' && !player.answered) speak(text);
    }, 350);
  }
  window.scrollTo({ top:0, behavior:'smooth' });
}

/* ============================================================
   11. ACCIONES
   ============================================================ */
function startLesson(unitId, kind){
  if (LESSON_KINDS.indexOf(kind) === -1) kind = 'v';
  const unit = unitById(unitId);
  if (!isUnitUnlocked(unit)){ toast(t('unitLocked'), 'fa-lock'); return; }
  stopActiveRecognition();
  try { window.speechSynthesis.cancel(); } catch(e){}
  player = {
    unit: unit.id, level: unit.level, kind: kind, i: 0, revealed: false, answered: false,
    chosen: null, correct: 0, xpEarned: 0, done: false,
    cards: kind === 'v' ? buildCards(unit.id) : null,
    questions: kind === 'q' ? buildQuestions(unit.id) : null,
    items: (kind === 's' || kind === 'w' || kind === 'd') ? buildItems(unit.id, kind) : null,
    inputDraft: '', userAnswer: '', transcript: '', isCorrect: null,
    micError: null, listening: false, micFallback: false, hintOpen: false, autoPlayed: false
  };
  screen = { name:'lesson' };
  render();
}
function finishLesson(){
  stopActiveRecognition();
  try { window.speechSynthesis.cancel(); } catch(e){}
  const key = lessonKey(player.unit, player.kind);
  const firstTime = !state.completed[key];
  let xp;
  if (player.kind === 'v') xp = 15; else xp = 10 + player.correct * 4;
  if (firstTime){
    player.xpEarned = xp;
    state.completed[key] = true;
    state.xp += xp;
    touchStreak();
  } else {
    player.xpEarned = 5;
    state.xp += 5;
  }
  player.done = true;
  save();
  render();
  toast('+' + player.xpEarned + ' XP · ' + t(firstTime ? 'wellDone' : 'review'), 'fa-bolt');
}
function advance(){
  if (player.listening) stopActiveRecognition();
  player.i++;
  player.revealed = false;
  player.answered = false;
  player.chosen = null;
  player.inputDraft = '';
  player.userAnswer = '';
  player.transcript = '';
  player.isCorrect = null;
  player.micError = null;
  player.listening = false;
  player.micFallback = false;
  player.hintOpen = false;
  player.autoPlayed = false;
  const len = lessonLength();
  if (player.i >= len) finishLesson();
  else render();
}

document.addEventListener('click', function(e){
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const a = el.dataset.action;

  if (a === 'start'){
    const name = (document.getElementById('setupName').value || '').trim();
    const native = document.getElementById('setupNative').value;
    const target = document.getElementById('setupTarget').value;
    state.profile = { name: name || 'Estudiante', native: native, target: target, createdAt: Date.now() };
    uiLang = UI[native] ? native : 'es';
    save();
    screen = { name:'home' };
    render();
    toast(t('welcomeMsg'), 'fa-feather');
  }
  else if (a === 'nav-home'){ screen = { name:'home' }; render(); }
  else if (a === 'nav-profile'){ screen = { name:'profile' }; render(); }
  else if (a === 'nav-path'){ const n = findNextLesson(); screen = { name:'path', level: n ? n.level : 'A1' }; render(); }
  else if (a === 'open-level'){ screen = { name:'path', level: el.dataset.level }; render(); }
  else if (a === 'locked'){ toast(t('pathLocked'), 'fa-lock'); }
  else if (a === 'resume'){ const n = findNextLesson(); if (n) startLesson(n.unit, n.kind); }
  else if (a === 'start-lesson'){ startLesson(el.dataset.unit, el.dataset.kind); }
  else if (a === 'exit-lesson'){ screen = { name:'path', level: player.level }; render(); }
  else if (a === 'speak'){ speak(el.dataset.text, targetLang(curTarget()).tts); }
  else if (a === 'start-listening'){ startListening(); }
  else if (a === 'stop-listening'){ stopListening(); }
  else if (a === 'use-typing'){
    stopActiveRecognition();
    player.micFallback = true;
    player.listening = false;
    player.micError = null;
    render();
    const input = document.getElementById('answerInput');
    if (input) setTimeout(function(){ try { input.focus(); } catch(err){} }, 60);
  }
  else if (a === 'check-answer'){ checkTypedAnswer(); }
  else if (a === 'retry-speaking'){
    player.answered = false;
    player.isCorrect = null;
    player.transcript = '';
    player.userAnswer = '';
    player.inputDraft = '';
    player.micError = null;
    render();
  }
  else if (a === 'toggle-hint'){ player.hintOpen = !player.hintOpen; render(); }
  else if (a === 'reveal'){ player.revealed = true; render(); }
  else if (a === 'answer'){
    if (player.answered) return;
    const idx = parseInt(el.dataset.index, 10);
    player.answered = true;
    player.chosen = idx;
    if (idx === player.questions[player.i].answer) player.correct++;
    render();
  }
  else if (a === 'next'){ advance(); }
  else if (a === 'retry'){ startLesson(player.unit, player.kind); }
  else if (a === 'back-path'){ screen = { name:'path', level: player.level }; render(); }
  else if (a === 'toggle-speed'){ state.settings.rate = state.settings.rate >= 1 ? 0.8 : 1.1; save(); render(); }
  else if (a === 'reset'){
    if (confirm(t('resetConfirm'))){
      localStorage.removeItem(STORE_KEY);
      const keepLang = uiLang;
      state = JSON.parse(JSON.stringify(DEFAULT_STATE));
      uiLang = keepLang;
      screen = { name:'home' };
      render();
      toast(t('resetProgress'), 'fa-trash-can');
    }
  }
});

document.addEventListener('input', function(e){
  if (player && e.target && e.target.matches && e.target.matches('[data-input="answer"]')){
    player.inputDraft = e.target.value;
  }
});

document.addEventListener('keydown', function(e){
  if (e.key !== 'Enter' || e.isComposing) return;
  if (screen.name !== 'lesson' || !player || player.done) return;
  const tag = e.target && e.target.tagName ? e.target.tagName.toLowerCase() : '';
  if (tag === 'button' || tag === 'a') return;
  if (player.answered){ e.preventDefault(); advance(); return; }
  if (player.kind === 'w' || player.kind === 'd' || (player.kind === 's' && document.getElementById('answerInput'))){
    e.preventDefault();
    checkTypedAnswer();
  }
});

document.addEventListener('change', function(e){
  const el = e.target.closest('[data-change]');
  if (!el) return;
  const what = el.dataset.change;
  if (!state.profile) return;
  if (what === 'native'){
    state.profile.native = el.value;
    uiLang = UI[el.value] ? el.value : 'es';
    save(); render();
  } else if (what === 'target'){
    state.profile.target = el.value;
    save(); render();
  }
});

document.getElementById('app').addEventListener('change', function(e){
  if (!state.profile && e.target && e.target.id === 'setupNative'){
    setupDraft.name = document.getElementById('setupName').value;
    setupDraft.target = document.getElementById('setupTarget').value;
    setupDraft.native = e.target.value;
    uiLang = UI[e.target.value] ? e.target.value : 'es';
    render();
  }
  if (!state.profile && e.target && e.target.id === 'setupTarget'){
    setupDraft.name = document.getElementById('setupName').value;
    setupDraft.native = document.getElementById('setupNative').value;
    setupDraft.target = e.target.value;
    render();
  }
});

/* ============================================================
   12. BOOT
   ============================================================ */
load();
render();
</script>
</body>
</html>
